plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sturgeon.tianxueversion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sturgeon.tianxueversion'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
